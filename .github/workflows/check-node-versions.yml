name: Check Node.js versions

on:
  schedule:
    - cron: "0 5 */3 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 nodejs/image/check_versions.py
      - uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "feat(nodejs): sync versions from the Node.js release calendar"
          title: "feat(nodejs): new supported Node.js versions"
          body: "Auto-adds still-supported majors (nodejs/Release calendar). EOL versions are never auto-removed: review manually."
          branch: bot/nodejs-versions
          delete-branch: true
