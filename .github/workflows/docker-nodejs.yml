name: Build Node.js images

on:
  push:
    branches: [root]
    paths:
      - "nodejs/image/**"
      - "nodejs/versions.json"
      - ".github/workflows/docker-nodejs.yml"
  workflow_dispatch:
  schedule:
    # Rebuild hebdo : les tags majeurs flottants (node:24-trixie-slim)
    # recuperent les derniers patchs CVE à chaque build.
    - cron: "0 4 * * 1"

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.versions.outputs.node }}
    steps:
      - uses: actions/checkout@v4
      - id: versions
        run: echo "node=$(tr -d ' \n' < nodejs/versions.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ${{ fromJson(needs.matrix.outputs.node) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: nodejs/image
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: NODE_VERSION=${{ matrix.node }}
          tags: ${{ env.REGISTRY }}/${{ github.repository }}:nodejs_${{ matrix.node }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
