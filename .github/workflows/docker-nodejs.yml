name: Build Node.js images

on:
  push:
    branches: [root]
    paths:
      - "nodejs/image/**"
      - "nodejs/versions.json"
      - ".github/workflows/docker-nodejs.yml"
  workflow_dispatch:
  schedule:
    # Rebuild hebdo : les tags majeurs flottants (node:24-trixie-slim)
    # recuperent les derniers patchs CVE à chaque build.
    - cron: "0 4 * * 1"

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      node: ${{ steps.versions.outputs.node }}
    steps:
      - uses: actions/checkout@v7
      - id: versions
        run: echo "node=$(tr -d ' \n' < nodejs/versions.json)" >> "$GITHUB_OUTPUT"

  # Build natif par archi (pas de QEMU) : amd64 sur runner x64,
  # arm64 sur runner ARM. Les digestes sont fusionnes dans `merge`.
  build:
    needs: matrix
    strategy:
      matrix:
        node: ${{ fromJson(needs.matrix.outputs.node) }}
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: nodejs/image
          platforms: linux/${{ matrix.arch }}
          build-args: NODE_VERSION=${{ matrix.node }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-nodejs_${{ matrix.node }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error

  merge:
    needs: [matrix, build]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: ${{ fromJson(needs.matrix.outputs.node) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-nodejs_${{ matrix.node }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - working-directory: /tmp/digests
        run: |
          docker buildx imagetools create -t ${{ env.REGISTRY }}/${{ github.repository }}:nodejs_${{ matrix.node }} $(printf "${{ env.REGISTRY }}/${{ github.repository }}@sha256:%s " *)
